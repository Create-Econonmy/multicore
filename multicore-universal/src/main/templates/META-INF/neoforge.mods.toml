modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Server-side only: players do not need it installed to join.
displayTest="IGNORE_SERVER_VERSION"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# The pack-specific MultiCore Server does the same job; only one of them may tick the dimensions.
[[dependencies.${mod_id}]]
modId="multicore"
type="incompatible"
reason="MultiCore Universal replaces MultiCore Server. Remove multicore-*.jar."
versionRange="*"
ordering="NONE"
side="BOTH"
