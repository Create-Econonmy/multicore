modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# Server-side only: players do not need it installed to join.
displayTest="IGNORE_SERVER_VERSION"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Lithium options that keep one shared set per world, changed from entity and block entity ticks. With region threads
# (several threads ticking one world) those sets would be changed by two threads at once, so MultiCore turns them off.
# Lithium reads this table from every installed mod. Turning off entity_movement_tracking also turns off Lithium's hopper
# optimisations (hoppers then tick like vanilla).
["lithium:options"]
"mixin.entity.inactive_navigations" = false
"mixin.util.entity_movement_tracking" = false
"mixin.world.game_events.dispatch" = false
